name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Core + simulator + tes (Linux, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  host-macos:
    name: Core + simulator + tes (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DLA_FIRMWARE_CHECK=OFF
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  firmware-esp:
    name: Firmware ${{ matrix.target }} (ESP-IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32s3, idf: v5.3.2 }
          - { target: esp32s3, idf: v5.4.1 }
          - { target: esp32p4, idf: v5.5.1 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: firmware/esp
      - uses: actions/upload-artifact@v4
        with:
          name: leumpang-${{ matrix.target }}-${{ matrix.idf }}
          path: |
            firmware/esp/build/*.bin
            firmware/esp/build/bootloader/bootloader.bin
            firmware/esp/build/partition_table/partition-table.bin
            firmware/esp/build/flash_args

  radio-esp32:
    name: Leumpang Radio ESP32 klasik (Bluepad32, IDF v5.4.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build firmware radio
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32
          path: firmware/radio/esp32
      - uses: actions/upload-artifact@v4
        with:
          name: leumpang-radio-esp32
          path: |
            firmware/radio/esp32/build/*.bin
            firmware/radio/esp32/build/bootloader/bootloader.bin
            firmware/radio/esp32/build/partition_table/partition-table.bin
            firmware/radio/esp32/build/flash_args

  radio-pico:
    name: Leumpang Radio ${{ matrix.board }} (Bluepad32, Pico SDK 2.2.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico2_w, pico_w]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'
      - name: Pico SDK 2.2.0
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/btstack lib/cyw43-driver lib/lwip lib/tinyusb lib/mbedtls
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
      - name: Build
        working-directory: firmware/radio/pico2w
        run: |
          cmake -B build -DPICO_BOARD=${{ matrix.board }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          cp build/leumpang_radio.uf2 build/leumpang_radio_${{ matrix.board }}.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: leumpang-radio-${{ matrix.board }}
          path: firmware/radio/pico2w/build/leumpang_radio_${{ matrix.board }}.uf2

  firmware-stm32:
    name: Firmware STM32H562 (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'
      - name: Configure
        working-directory: firmware/stm32h562
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - name: Build
        working-directory: firmware/stm32h562
        run: cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: leumpang-stm32h562
          path: |
            firmware/stm32h562/build/*.bin
            firmware/stm32h562/build/*.hex
            firmware/stm32h562/build/*.elf

  studio-linux:
    name: Studio desktop (Linux, Qt 6.8) + selftest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Paket sistem (GL, xcb, xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb ninja-build xvfb libgl1-mesa-dev libegl1 libglx-mesa0 mesa-utils \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-xkb1 libfontconfig1 libpulse0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtquick3d qtshadertools qtserialport qtmultimedia'
          cache: true
      - uses: actions/cache@v4
        with:
          path: ort
          key: ort-1.22.0-linux
      - name: ONNX Runtime (unduh dengan retry)
        run: |
          [ -f ort/lib/libonnxruntime.so ] && exit 0
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          mkdir -p ort && tar xzf ort.tgz -C ort --strip-components=1
      - name: Build
        run: |
          cmake -S studio -B build-studio -G Ninja -DCMAKE_BUILD_TYPE=Release -DLA_ORT_DIR=$PWD/ort
          cmake --build build-studio
      - name: Selftest (xvfb + Mesa llvmpipe)
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" gdb -q -batch -return-child-result \
            -ex run -ex "thread apply all bt 25" --args ./build-studio/leumpang_studio --selftest studio-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-selftest-linux
          path: studio-shots
      - name: Tangkapan layar -> cabang ci-shots
        if: always() && github.event_name == 'push'
        run: |
          [ -d studio-shots ] || exit 0
          git config user.name "leumpang-ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/shots && cp -r studio-shots/. /tmp/shots/
          git checkout --orphan ci-shots-tmp
          git rm -rfq . >/dev/null
          git clean -fdxq
          cp -r /tmp/shots/. . && git add -A
          git commit -qm "selftest studio ${GITHUB_SHA::7} (linux)" && git push -f origin HEAD:ci-shots

  studio-windows:
    name: Studio desktop (Windows x64, Qt 6.8)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtquick3d qtshadertools qtserialport qtmultimedia'
          cache: true
      - uses: actions/cache@v4
        with:
          path: ort
          key: ort-1.22.0-windows
      - name: ONNX Runtime (unduh dengan retry)
        shell: bash
        run: |
          [ -f ort/lib/onnxruntime.dll ] && exit 0
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o ort.zip \
            https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip
          7z x -y ort.zip > /dev/null && mv onnxruntime-win-x64-1.22.0 ort
      - name: Build
        run: |
          cmake -S studio -B build-studio -G "Visual Studio 17 2022" -A x64 -DLA_ORT_DIR="${{ github.workspace }}/ort"
          cmake --build build-studio --config Release
      - name: Paket (windeployqt)
        shell: pwsh
        run: |
          $out = "LeumpangStudio"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build-studio/Release/leumpang_studio.exe $out/
          Copy-Item build-studio/Release/onnxruntime.dll $out/
          windeployqt --release --qmldir studio/qml --no-translations $out/leumpang_studio.exe
          Copy-Item LICENSE $out/
          Copy-Item studio/README.md $out/README.md
      - name: Selftest (WARP / software)
        continue-on-error: true
        shell: pwsh
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
        run: |
          $p = Start-Process -FilePath LeumpangStudio/leumpang_studio.exe -ArgumentList "--selftest","studio-shots-win" -PassThru -Wait -NoNewWindow
          if (Test-Path studio-shots-win/selftest.log) { Get-Content studio-shots-win/selftest.log }
          Write-Host "exit code: $($p.ExitCode)"
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: LeumpangStudio-windows-x64
          path: LeumpangStudio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-selftest-windows
          path: studio-shots-win
      - name: Tangkapan layar -> cabang ci-shots-win
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          [ -d studio-shots-win ] || exit 0
          git config user.name "leumpang-ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p ../shots && cp -r studio-shots-win/. ../shots/
          git checkout -q --orphan ci-shots-tmp
          git rm -rfq . >/dev/null
          git clean -fdxq
          cp -r ../shots/. . && git add -A
          git commit -qm "selftest studio ${GITHUB_SHA::7} (windows)" && git push -f origin HEAD:ci-shots-win

  android:
    name: Android "mata" (tes Kotlin + integrasi sim + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Simulator C++ untuk tes integrasi LAP
        run: |
          cmake -B build -DLA_SANITIZE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target leumpang_sim -j
          ./build/leumpang_sim --gait --quiet --no-stdin > sim.log 2>&1 &
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Tes + APK
        run: gradle -p android :lap:test :bus:test :perception:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LeumpangMata-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/*/build/reports/tests
